# SonarQube Project Configuration for Freelenso
sonar.projectKey=freelenso-project
sonar.projectName=Freelenso Microservices
sonar.projectVersion=1.0

# Source directories
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/venv/**,**/env/**,**/__pycache__/**,**/migrations/**,**/static/**,**/media/**

# Language specific settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test directories
sonar.tests=tests/
sonar.test.exclusions=**/migrations/**

# Encoding
sonar.sourceEncoding=UTF-8

# SonarQube server (will be overridden by Jenkins)
sonar.host.url=http://localhost:9000
