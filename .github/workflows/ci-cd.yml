name: Freelenso CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push user-service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          push: true
          tags: jayasurya88/freelenso-user-service:latest

      - name: Build and push project-service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/project-service
          push: true
          tags: jayasurya88/freelenso-project-service:latest

      - name: Build and push payment-service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/payment-service
          push: true
          tags: jayasurya88/freelenso-payment-service:latest

      - name: Build and push notification-service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification-service
          push: true
          tags: jayasurya88/freelenso-notification-service:latest

      - name: Build and push api-gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-gateway
          push: true
          tags: jayasurya88/freelenso-api-gateway:latest

      - name: Build and push web application
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jayasurya88/freelenso-web:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'freelenso-web-1757158189'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'jayasurya88/freelenso-web:latest' 